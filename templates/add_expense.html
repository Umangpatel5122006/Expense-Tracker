{% extends "base.html" %}

{% block title %}Add Expense — Spendly{% endblock %}

{% block content %}
<div class="form-container">
    <h1>Add New Expense</h1>
    <p class="form-subtitle">Keep track of your spending to master your budget.</p>

    {% if error %}
    <div class="error-message">
        {{ error }}
    </div>
    {% endif %}

    <form method="POST" class="expense-form">
        <div class="form-group">
            <label for="amount">Amount (₹)</label>
            <input type="number" id="amount" name="amount" step="0.01" min="0.01"
                   value="{{ amount if amount }}" required placeholder="0.00">
        </div>

        <div class="form-group">
            <label for="category">Category</label>
            <select id="category" name="category" required>
                <option value="" disabled {% if not category %}selected{% endif %}>Select a category</option>
                {% for cat in categories %}
                <option value="{{ cat }}" {% if category == cat %}selected{% endif %}>{{ cat }}</option>
                {% endfor %}
            </select>
        </div>

        <div class="form-group">
            <label for="date">Date</label>
            <input type="date" id="date" name="date"
                   value="{{ date if date }}" required>
        </div>

        <div class="form-group">
            <label for="description">Description (Optional)</label>
            <textarea id="description" name="description"
                      placeholder="What was this for?">{{ description if description }}</textarea>
        </div>

        <div class="form-actions">
            <button type="submit" class="btn-primary">Save Expense</button>
            <a href="{{ url_for('profile') }}" class="btn-secondary">Cancel</a>
        </div>
    </form>
</div>

<style>
    .form-container {
        max-width: 500px;
        margin: 2rem auto;
        padding: 2rem;
        background: var(--bg-card);
        border-radius: var(--radius-lg);
        box-shadow: var(--shadow-sm);
    }
    .form-subtitle {
        color: var(--text-muted);
        margin-bottom: 2rem;
    }
    .form-group {
        margin-bottom: 1.5rem;
        display: flex;
        flex-direction: column;
        gap: 0.5rem;
    }
    .form-group label {
        font-weight: 500;
        font-size: 0.9rem;
        color: var(--text-main);
    }
    .form-group input, .form-group select, .form-group textarea {
        padding: 0.75rem;
        border: 1px solid var(--border-color);
        border-radius: var(--radius-md);
        background: var(--bg-input);
        color: var(--text-main);
        font-family: inherit;
    }
    .form-group textarea {
        resize: vertical;
        min-height: 80px;
    }
    .form-actions {
        display: flex;
        gap: 1rem;
        margin-top: 2rem;
    }
    .btn-primary {
        background: var(--accent);
        color: white;
        padding: 0.75rem 1.5rem;
        border: none;
        border-radius: var(--radius-md);
        cursor: pointer;
        font-weight: 600;
        flex: 1;
        transition: background 0.2s;
    }
    .btn-primary:hover {
        background: var(--ink);
    }
    .btn-secondary {
        background: transparent;
        color: var(--text-muted);
        padding: 0.75rem 1.5rem;
        border: 1px solid var(--border-color);
        border-radius: var(--radius-md);
        text-decoration: none;
        text-align: center;
        font-weight: 500;
        flex: 1;
    }
    .error-message {
        background: #fee2e2;
        color: #b91c1c;
        padding: 0.75rem;
        border-radius: var(--radius-md);
        margin-bottom: 1.5rem;
        font-size: 0.9rem;
        border: 1px solid #fecaca;
    }
</style>
{% endblock %}
